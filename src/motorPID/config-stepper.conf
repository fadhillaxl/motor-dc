# AdaptivePID Stepper Configuration
# Edit values below, then run:
#   python AdaptivePID.py --config config-stepper.conf

[stepper_az]
step_pin = 17
dir_pin = 27
en_pin = 22
microstep = 2
max_speed_sps = 2200.0
accel_sps2 = 3000.0
soft_limit_min_deg = 0.0
soft_limit_max_deg = 360.0
limit_min_pin =
limit_max_pin =
limit_active_low = true
dir_sign = 1
offset_deg = 0.0

[stepper_el]
step_pin = 23
dir_pin = 24
en_pin = 25
microstep = 2
max_speed_sps = 2200.0
accel_sps2 = 3000.0
soft_limit_min_deg = 0.0
soft_limit_max_deg = 90.0
limit_min_pin =
limit_max_pin =
limit_active_low = true
dir_sign = 1
offset_deg = 0.0

[limit_switch]
enabled = true
use_hw_switch = true
safety_margin_deg = 0.5
az_min_deg = 0.0
az_max_deg = 360.0
el_min_deg = 0.0
el_max_deg = 90.0
